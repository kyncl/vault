[package]
name = "vault"
version = "0.1.0"
edition = "2024"
authors = ["kyncl <145004616+kyncl@users.noreply.github.com>"]
description = "Static site generator for parsing Markdown into a cohesive HTML documentation vault"
repository = "https://github.com/kyncl/vault"
license = "MIT"
keywords = ["cli", "notes", "documentation-tool", "markdown"]
categories = ["command-line-utilities", "documentation-tool"]

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true

[dependencies]
markdown = "1.0.0"
syntect = "5.3.0"
regex = "1.10.4"
anyhow = "1.0.102"
minify-html = "0.18.1"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
inquire = "0.9.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
toml = "1.1.2"
# toml_edit = "0.25.12"
dirs = "6.0.0"

[target.'cfg(not(windows))'.dependencies]
katex = "0.4.6"

[target.'cfg(windows)'.dependencies]
katex = { version = "0.4.6", default-features = false, features = ["duktape"] }
